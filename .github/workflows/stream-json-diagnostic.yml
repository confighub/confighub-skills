name: stream-json-diagnostic
on:
  push:
    branches: [claude/56-runner-diagnostic]
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runner image
        run: |
          grep -E "Image|Version" /imagegeneration/imagedata.json 2>/dev/null || true
          echo "jq: $(jq --version)"; echo "bash: $BASH_VERSION"
      - name: Interpreter inventory
        run: |
          for b in jq ruby; do echo "== $b: $(command -v $b)"; $b --version; done
          ls -la /usr/local/bin/jq /usr/bin/jq 2>/dev/null || true
          ruby -e 'require "json"; puts "json gem: #{JSON::VERSION}"'
      - name: Duplicate-nested case in isolation
        run: |
          set +e
          tmp=$(mktemp -d)
          printf '%s\n' '{"type":"system","subtype":"init","permissionMode":"manual"}' \
            '{"type":"result","subtype":"success","is_error":false,"permission_denials":[{"tool_name":"Bash","tool_use_id":"t","tool_input":{"command":"one","command":"two"}}]}' \
            > "$tmp/duplicate-nested.jsonl"
          ./tools/parse-claude-stream-json "$tmp/duplicate-nested.jsonl" > "$tmp/out.json" 2> "$tmp/err.txt"
          echo "parser rc=$?"
          echo "--- stdout ---"; cat "$tmp/out.json"
          echo "--- stderr ---"; cat "$tmp/err.txt"
      - name: Full adversarial suite
        run: ./tools/test-claude-stream-json
      - name: Full validator
        run: ./tools/validate-current-surface || true
